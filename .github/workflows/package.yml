# Builds LatchVerify packages on native runners, for the targets a Linux workstation cannot
# build (the Windows installer) or may lack tools for (.deb). Manual trigger only. It keeps the
# packages as workflow-run artifacts; it never creates a release, tag or upload anywhere else.
name: package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (1.2.3 or 1.2.3-rc.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: linux-tarball deb windows-zip
          # GitHub's Windows images include Inno Setup 6 (ISCC.exe).
          - os: windows-latest
            targets: windows-installer
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for target in ${{ matrix.targets }}; do
            pnpm package "$target" --version "$VERSION"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: latchverify-${{ inputs.version }}-${{ matrix.os }}
          path: |
            build/packages/*/*/*
            !build/packages/.work
          if-no-files-found: error
