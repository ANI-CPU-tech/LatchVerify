# Builds LatchVerify packages on native runners, for the targets a Linux workstation cannot
# build (the Windows installer) or may lack tools for (.deb). Manual trigger only. It keeps the
# packages as workflow-run artifacts; it never creates a release, tag or upload anywhere else.
name: package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (1.2.3 or 1.2.3-rc.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: linux-tarball deb windows-zip
          # GitHub's Windows images include Inno Setup 6 (ISCC.exe).
          - os: windows-latest
            targets: windows-installer
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # bsdtar writes the Windows zip; desktop-file-validate checks the desktop entry.
      - name: Install packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libarchive-tools desktop-file-utils
      - name: Build packages
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        # Build every target, then fail the job if any of them failed.
        run: |
          failed=""
          for target in ${{ matrix.targets }}; do
            pnpm package "$target" --version "$VERSION" || failed="$failed $target"
          done
          if [ -n "$failed" ]; then
            echo "::error::failed targets:$failed"
            exit 1
          fi
      # Uploads whatever succeeded, even when another target failed.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: latchverify-${{ inputs.version }}-${{ matrix.os }}
          path: |
            build/packages/*/*/*
            !build/packages/.work/**
            !build/packages/.jobs/**
          if-no-files-found: warn
